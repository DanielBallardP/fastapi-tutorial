[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Pfanzagl", email = "daniel.pfanzagl@gmail.com (mailto:daniel.pfanzagl@gmail.com)" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
]

[project.scripts]
fastapi-tutorial = "fastapi_tutorial:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
